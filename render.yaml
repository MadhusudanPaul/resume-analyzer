# render.yaml — Render.com deployment config for the backend
services:
  - type: web
    name: resume-analyzer-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: CLIENT_URL
        value: https://your-vercel-app.vercel.app   # Replace with your Vercel URL
      - key: NODE_ENV
        value: production
